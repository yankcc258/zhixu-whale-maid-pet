[package]
name = "zhixu-whale-pet"
version = "0.1.0"
description = "知序的鲸鱼娘桌宠"
authors = ["Yank"]
edition = "2021"

[lib]
name = "zhixu_whale_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
