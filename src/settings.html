<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>希狐的设置</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <img src="sprites/smug.webp" alt="" />
      <div>
        <h1>希狐的设置</h1>
        <p>改完马上生效，不用保存。</p>
      </div>
    </header>
    <section>
      <h2>称呼和网站</h2>
      <label class="field">她怎么叫你 <input type="text" data-key="name" maxlength="12" placeholder="Yank" /></label>
      <label class="field">双击打开的网站 <input type="text" data-key="siteName" maxlength="12" placeholder="知序" /></label>
      <label class="field">网址 <input type="url" data-key="siteUrl" maxlength="300" placeholder="https://yank-study-lab.yank-study-lab.workers.dev" /></label>
      <label class="field">天气城市 <input type="text" data-key="city" maxlength="30" placeholder="比如 厚木、东京、上海" /></label>
      <p class="muted">空着就用默认的。网址只认 http:// 或 https:// 开头的。城市空着就不查天气；填了以后会提醒带伞、喝水、加衣服（天气来自 open-meteo，不需要密钥）。</p>
    </section>
    <section>
      <h2>形象</h2>
      <div class="seg" data-key="figure">
        <button data-v="q">Q 版<small>现在的希狐</small></button>
        <button data-v="mini" disabled title="还在画">迷你人形<small>制作中</small></button>
      </div>
      <div class="seg sub" data-key="qStyle">
        <button data-v="live2d">动态<small>Live2D：眨眼、看鼠标、做动作</small></button>
        <button data-v="static">静态<small>以前的立绘</small></button>
      </div>
      <p class="muted">动态现在有女仆装、睡衣、冬装、被炉；别的衣服、躲在边上、跑步时会自动换回立绘。电脑卡就选静态。右键菜单里也能一键切换。</p>
      <label><input type="checkbox" data-key="pixel" /> 👾 像素模式：红白机画风（马赛克 + 复古配色），动态和静态都变</label>
    </section>
    <section>
      <h2>音效</h2>
      <div class="seg" data-key="sfx">
        <button data-v="off">关</button>
        <button data-v="low">小</button>
        <button data-v="mid">中</button>
        <button data-v="high">大</button>
      </div>
      <p class="muted">红白机风格的小音效：戳、摸头、拎起来、落地、双击、开菜单会响，衣柜收到新衣服有通关音乐。她自己冒话不出声；安静模式时也不响。</p>
    </section>
    <section>
      <h2>吐槽频率</h2>
      <div class="seg" data-key="chatty">
        <button data-v="low">少<small>45–90 分钟</small></button>
        <button data-v="mid">中<small>20–45 分钟</small></button>
        <button data-v="high">多<small>8–15 分钟</small></button>
      </div>
    </section>
    <section>
      <h2>活跃度</h2>
      <div class="seg" data-key="activity">
        <button data-v="calm">安静<small>待着不动</small></button>
        <button data-v="normal">普通<small>几分钟跑一趟</small></button>
        <button data-v="lively">好动<small>一两分钟一趟</small></button>
      </div>
      <p class="muted">只沿着她现在的高度左右跑；拖着、躲在边上、睡觉时不跑。</p>
    </section>
    <section>
      <h2>睡觉时间</h2>
      <div class="seg" data-key="sleep">
        <button data-v="off">不睡</button>
        <button data-v="22-6">22–6</button>
        <button data-v="23-6">23–6</button>
        <button data-v="0-7">0–7</button>
        <button data-v="1-8">1–8</button>
      </div>
    </section>
    <section>
      <label><input type="checkbox" data-key="gameMode" /> 有全屏程序（游戏、全屏视频）时自动躲起来</label>
      <label><input type="checkbox" data-key="quiet" /> 安静模式（不自己冒话）</label>
      <label><input type="checkbox" data-key="wardrobeLocked" /> 收集模式：衣柜里只放到日子见过的衣服</label>
      <label><input type="checkbox" id="autostart" /> 开机自动启动</label>
      <p class="muted" id="autostart-err"></p>
    </section>
    <footer>
      <button id="reset">位置复位到右下角</button>
      <span class="muted">版本 <b id="ver"></b></span>
    </footer>
    <script src="settings.js"></script>
  </body>
</html>
