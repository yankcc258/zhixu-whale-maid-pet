# 用 GitHub 的 Windows 机器打包安装程序。
# - 推到 main 或开 PR：打包，安装程序放在这次运行的 Artifacts 里（保留 14 天）。
# - 打 v 开头的标签（例如 v0.3.0）：打包后发布到本仓库的 Releases，连同签名和 latest.json，
#   已经装好的鲸鱼娘会自己检查到并提示更新。
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（tauri signer generate 生成的 .key 文件内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      - name: 标签和版本号要一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "标签 ${GITHUB_REF_NAME} 和 tauri.conf.json 的版本 $v 不一致"; exit 1; }

      # 先单独试一次签名：钥匙或密码不对时，在 PR 页面的注释里直接说清楚（secrets 会被自动打码）
      - name: 检查签名钥匙
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::没有设置 TAURI_SIGNING_PRIVATE_KEY"; exit 1; fi
          head=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d ' \r\n' | base64 -d 2>/dev/null | head -1)
          case "$head" in
            *"secret key"*) echo "私钥格式正确：$head" ;;
            *) echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是私钥文件的内容（应该是 zhixu-whale.key 里那一长串，不是密码）"; exit 1 ;;
          esac
          echo test > sign-test.txt
          if ! out=$(npx tauri signer sign sign-test.txt 2>&1); then
            echo "::error::签名失败（多半是密码不对）：$(printf '%s' "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "签名测试通过"

      - name: 打包（带更新签名）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            grep -E "error|Error|failed" build.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZhixuWhale-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      - name: 生成 latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/latest-json.mjs "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > src-tauri/target/release/bundle/nsis/latest.json

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 鲸鱼娘 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
