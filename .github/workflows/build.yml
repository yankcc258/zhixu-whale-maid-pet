# 用 GitHub 的 Windows 机器打包安装程序。
# - 推到 main 或开 PR：打包，安装程序放在这次运行的 Artifacts 里（保留 14 天）。
# - main 上的版本号（tauri.conf.json）还没有对应的 v 标签时：打包后自动发布到本仓库的 Releases
#   （顺便建好标签），连同签名和 latest.json，已经装好的狐狸娘会自己检查到并提示更新。
#   也就是说：改版本号的 PR 一合并，就自动发版。手动推 v 开头的标签也会发布。
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（tauri signer generate 生成的 .key 文件内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      - name: 看这次要不要发布
        id: rel
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "::error::标签 ${GITHUB_REF_NAME} 和 tauri.conf.json 的版本 $v 不一致"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            echo "main 上的 $v 还没发布过，这次发布"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      # 先单独试一次签名：钥匙或密码不对时，在 PR 页面的注释里直接说清楚（secrets 会被自动打码）
      - name: 检查签名钥匙
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error::没有设置 TAURI_SIGNING_PRIVATE_KEY"; exit 1; fi
          head=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d ' \r\n' | base64 -d 2>/dev/null | head -1)
          case "$head" in
            *"secret key"*) echo "私钥格式正确：$head" ;;
            *) echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是私钥文件的内容（应该是 zhixu-whale.key 里那一长串，不是密码）"; exit 1 ;;
          esac
          echo test > sign-test.txt
          if ! out=$(npx tauri signer sign sign-test.txt 2>&1); then
            echo "::error::签名失败（多半是密码不对）：$(printf '%s' "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          node scripts/check-sig.mjs sign-test.txt sign-test.txt.sig

      - name: 打包（带更新签名）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            grep -E "error|Error|failed" build.log | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZhixuWhale-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      - name: 生成 latest.json
        if: steps.rel.outputs.release == 'true'
        shell: bash
        run: node scripts/latest-json.mjs "${{ steps.rel.outputs.tag }}" "${GITHUB_REPOSITORY}" > src-tauri/target/release/bundle/nsis/latest.json

      - name: 发布到 Releases
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 狐狸娘 ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
